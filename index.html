<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Sorpresa Hot Wheels!</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #ff6600;
      --yellow: #ffcc00;
      --blue-glow: #00d2ff;
      --dark-bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: var(--dark-bg);
      color: #fff;
    }

    /* PANTALLA 1: INTRO */
    #screen-intro {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 40%, #112244 0%, #050b18 70%, #02040a 100%);
      transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.5s;
    }

    #screen-intro.hide {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .track-border-top, .track-border-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 16px;
      background: repeating-linear-gradient(-45deg, var(--yellow), var(--yellow) 20px, #111 20px, #111 40px);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
      z-index: 10;
    }
    .track-border-top { top: 0; }
    .track-border-bottom { bottom: 0; }

    .drag-lights {
      display: flex;
      gap: 16px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 24px;
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      margin-top: 10px;
      z-index: 5;
    }

    .light-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #222;
      box-shadow: inset 0 0 8px #000;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .light-dot.red { background: #ff3333; box-shadow: 0 0 20px #ff3333; }
    .light-dot.yellow { background: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
    .light-dot.green { background: #00ff66; box-shadow: 0 0 25px #00ff66; }

    .hero-title-container {
      text-align: center;
      z-index: 5;
    }

    .hero-subtitle {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1rem, 3vw, 1.6rem);
      letter-spacing: 4px;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
    }

    .hero-title {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(3.5rem, 13vw, 7rem);
      letter-spacing: 4px;
      color: #fff;
      background: linear-gradient(180deg, #ffffff 20%, var(--yellow) 60%, var(--orange) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 102, 0, 0.8));
    }

    .floating-cars-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .f-car-card {
      position: absolute;
      width: min(200px, 28vw);
      height: min(130px, 18vw);
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(255, 204, 0, 0.7);
      box-shadow: 0 0 30px rgba(255, 102, 0, 0.8);
      animation: floatMotion 4s ease-in-out infinite alternate;
    }

    .c1 { top: 15%; left: 5%; animation-delay: 0s; }
    .c2 { top: 18%; right: 5%; animation-delay: 1s; }
    .c3 { top: 48%; left: 3%; animation-delay: 2s; }
    .c4 { top: 52%; right: 3%; animation-delay: 1.5s; }
    .c5 { bottom: 15%; left: 20%; animation-delay: 2.5s; }
    .c6 { bottom: 15%; right: 20%; animation-delay: 0.5s; }

    @keyframes floatMotion {
      from { transform: translateY(0px) rotate(-4deg) scale(0.95); }
      to { transform: translateY(-18px) rotate(4deg) scale(1.05); }
    }

    .btn-action-start {
      position: relative;
      z-index: 10;
      background: linear-gradient(180deg, #ff9900 0%, #ff3300 100%);
      color: #fff;
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1.4rem, 4.5vw, 2.5rem);
      padding: 22px 65px;
      border-radius: 60px;
      border: 4px solid var(--yellow);
      box-shadow: 0 0 45px rgba(255, 102, 0, 0.95), inset 0 4px 0 rgba(255, 255, 255, 0.6);
      cursor: pointer;
      letter-spacing: 2px;
      animation: pulseGlow 1.2s infinite alternate;
      transition: transform 0.1s;
      margin-bottom: 10px;
    }

    .btn-action-start:active {
      transform: scale(0.94);
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 25px rgba(255, 102, 0, 0.8); }
      to { transform: scale(1.08); box-shadow: 0 0 50px rgba(255, 204, 0, 1); }
    }

    /* PANTALLA 2: RAMO */
    #screen-bouquet {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 0px;
      background: radial-gradient(circle at 50% 50%, #0d1e3a 0%, #030712 100%);
    }

    .header-tag {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 204, 0, 0.5);
      padding: 14px 45px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .header-tag h2 {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: #fff;
    }

    .header-tag span {
      color: var(--yellow);
    }

    /* Contenedor del Ramo */
    .bouquet-container {
      position: relative;
      width: 100%;
      max-width: 950px;
      height: min(780px, 85vh);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      animation: swayBouquet 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes swayBouquet {
      from { transform: rotate(-1.5deg); }
      to { transform: rotate(1.5deg); }
    }

    .stems-svg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 85%;
      z-index: 1;
    }

    /* Flores de Blister Hot Wheels */
    .flower-item {
      position: absolute;
      z-index: 3;
      width: clamp(120px, 18vw, 210px);
      height: clamp(150px, 22vw, 260px);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .flower-item:hover {
      transform: scale(1.15) translateY(-10px) !important;
    }

    .flower-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Pétalos Neón */
    .petals-bg {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, rgba(0, 68, 255, 0.1) 70%);
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.6);
      z-index: 1;
    }

    .petals-bg::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, #38bdf8 0deg 30deg, transparent 30deg 60deg);
      opacity: 0.6;
      z-index: -1;
      animation: spinPetals 15s linear infinite;
    }

    @keyframes spinPetals {
      to { transform: rotate(360deg); }
    }

    /* Tarjeta Blister Hot Wheels */
    .hw-blister-mini {
      position: relative;
      z-index: 2;
      width: 88%;
      height: 92%;
      background: #0284c7;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
    }

    .mini-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Russo One', sans-serif;
      font-size: 0.65rem;
      color: var(--yellow);
    }

    .mini-plastic {
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.05) 80%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      height: 70%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-plastic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mini-title {
      font-family: 'Russo One', sans-serif;
      font-size: 0.6rem;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Posiciones del Ramo */
    .f1 { top: 2%; left: 38%; transform: scale(1.1); }
    .f2 { top: 16%; left: 16%; transform: scale(1.02); }
    .f3 { top: 16%; right: 16%; transform: scale(1.02); }
    .f4 { top: 38%; left: 2%; transform: scale(0.95); }
    .f5 { top: 38%; left: 38%; transform: scale(1.05); }
    .f6 { top: 38%; right: 2%; transform: scale(0.95); }

    /* MODAL GIGANTE */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card-lg {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid rgba(255, 204, 0, 0.5);
      border-radius: 28px;
      padding: 25px;
      width: 100%;
      max-width: 580px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 210, 255, 0.4);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-backdrop.active .modal-card-lg {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .blister-card-lg {
      width: 100%;
      background: #0284c7;
      border-radius: 20px;
      padding: 18px 18px 22px;
      border: 4px solid #38bdf8;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      margin-bottom: 18px;
    }

    .blister-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .hw-brand {
      font-family: 'Russo One', sans-serif;
      font-size: 1.6rem;
      color: var(--yellow);
      text-shadow: 3px 3px 0 #b91c1c;
    }

    .blister-window {
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.05) 80%);
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 10px;
      height: clamp(220px, 40vh, 320px);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .blister-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7));
    }

    .car-model-title {
      font-family: 'Russo One', sans-serif;
      font-size: 1.4rem;
      color: #fff;
      margin-top: 14px;
      letter-spacing: 1px;
    }

    .note-content-lg {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.5;
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <!-- PANTALLA 1: INTRO -->
  <div id="screen-intro">
    <div class="track-border-top"></div>

    <div class="drag-lights">
      <div class="light-dot red"></div>
      <div class="light-dot yellow"></div>
      <div class="light-dot green"></div>
    </div>

    <div class="hero-title-container">
      <div class="hero-subtitle">🏁 Edición Especial 🏁</div>
      <h1 class="hero-title">¡SORPRESA!</h1>
    </div>

    <div class="floating-cars-grid">
      <div class="f-car-card c1" style="background-image: url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=400');"></div>
      <div class="f-car-card c2" style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400');"></div>
      <div class="f-car-card c3" style="background-image: url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=400');"></div>
      <div class="f-car-card c4" style="background-image: url('https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=400');"></div>
      <div class="f-car-card c5" style="background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400');"></div>
      <div class="f-car-card c6" style="background-image: url('https://images.unsplash.com/photo-1563720223185-11003d516935?w=400');"></div>
    </div>

    <button class="btn-action-start" id="btn-start">🚀 ¡APRIETA AQUÍ! 🚀</button>

    <div class="track-border-bottom"></div>
  </div>

  <!-- PANTALLA 2: RAMO -->
  <div id="screen-bouquet">
    <div class="header-tag">
      <h2>Modo Sport Activado 🏎️💨 <span>¡Acelera Hoy!</span></h2>
    </div>

    <div class="bouquet-container">
      <svg class="stems-svg" viewBox="0 0 300 400" preserveAspectRatio="none">
        <defs>
          <linearGradient id="wrapGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
        </defs>

        <path d="M150,380 C130,260 30,120 10,40" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M150,380 C140,260 80,130 50,60" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M150,380 C150,260 150,100 150,10" stroke="#22c55e" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M150,380 C160,260 220,130 250,60" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M150,380 C170,260 270,120 290,40" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>

        <path d="M70,400 L150,260 L230,400 Z" fill="url(#wrapGrad)" stroke="#ffcc00" stroke-width="3"/>
        <path d="M150,260 L130,400 M150,260 L170,400" stroke="#ff6600" stroke-width="2" opacity="0.6"/>

        <path d="M120,290 C80,260 30,300 70,330 C110,320 130,300 120,290 Z" fill="#15803d"/>
        <path d="M180,290 C220,260 270,300 230,330 C190,320 170,300 180,290 Z" fill="#16a34a"/>
      </svg>

      <div class="flower-item f1" data-id="0">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=300" alt="Car"></div>
            <div class="mini-title">PAGANI ZONDA</div>
          </div>
        </div>
      </div>

      <div class="flower-item f2" data-id="1">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=300" alt="Car"></div>
            <div class="mini-title">BUGATTI CHIRON</div>
          </div>
        </div>
      </div>

      <div class="flower-item f3" data-id="2">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=300" alt="Car"></div>
            <div class="mini-title">NISSAN GT-R</div>
          </div>
        </div>
      </div>

      <div class="flower-item f4" data-id="3">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=300" alt="Car"></div>
            <div class="mini-title">LAMBORGHINI</div>
          </div>
        </div>
      </div>

      <div class="flower-item f5" data-id="4">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300" alt="Car"></div>
            <div class="mini-title">PORSCHE 911</div>
          </div>
        </div>
      </div>

      <div class="flower-item f6" data-id="5">
        <div class="flower-wrapper">
          <div class="petals-bg"></div>
          <div class="hw-blister-mini">
            <div class="mini-head"><span>HOT WHEELS</span><span>HW</span></div>
            <div class="mini-plastic"><img src="https://images.unsplash.com/photo-1563720223185-11003d516935?w=300" alt="Car"></div>
            <div class="mini-title">McLAREN SENNA</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL GIGANTE -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-card-lg">
      <button class="close-btn" id="btn-close">✕</button>
      
      <div class="blister-card-lg">
        <div class="blister-head">
          <span class="hw-brand">HOT WHEELS</span>
          <span style="color:#ffcc00; font-weight:bold; font-size:0.95rem;">HW EXOTICS</span>
        </div>
        
        <div class="blister-window">
          <img id="modal-car-img" src="" alt="Hot Wheels Car">
        </div>

        <div class="car-model-title" id="car-name">BUGATTI CHIRON</div>
      </div>

      <div class="note-content-lg" id="modal-note"></div>
    </div>
  </div>

  <script>
    const CARS_DATA = [
      {
        name: 'PAGANI ZONDA R',
        img: 'https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=800',
        note: '🏎️ 100% Neumático quemado: Cero excusas, puro éxito en todo lo que te propongas.'
      },
      {
        name: 'BUGATTI CHIRON',
        img: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800',
        note: '💨 Modo Sport activado: Que nada ni nadie te detenga hoy.'
      },
      {
        name: 'NISSAN GT-R R35',
        img: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800',
        note: '🏁 Un buen compañero de ruta vale más que un motor V12 a fondo en recta.'
      },
      {
        name: 'LAMBORGHINI SIÁN',
        img: 'https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=800',
        note: '🛠️ Tanque lleno y motor encendido: Hoy se acelera con todo.'
      },
      {
        name: 'PORSCHE 911 GT3',
        img: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800',
        note: '⚡ Cero frenos, cero estrés: A romper la pista este año.'
      },
      {
        name: 'McLAREN SENNA',
        img: 'https://images.unsplash.com/photo-1563720223185-11003d516935?w=800',
        note: '🔥 Prohibido frenar: Lo mejor de la carrera apenas está comenzando.'
      }
    ];

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createSparks(x, y) {
      for(let i=0; i<45; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 6 + 2,
          color: ['#ff9900', '#ffcc00', '#00d2ff', '#ffffff'][Math.floor(Math.random()*4)],
          life: 42
        });
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if(p.life <= 0) particles.splice(idx, 1);
      });
      requestAnimationFrame(renderFX);
    }
    renderFX();

    const btnStart = document.getElementById('btn-start');
    const screenIntro = document.getElementById('screen-intro');
    const modal = document.getElementById('modal');
    const modalCarImg = document.getElementById('modal-car-img');
    const carName = document.getElementById('car-name');
    const modalNote = document.getElementById('modal-note');
    const btnClose = document.getElementById('btn-close');
    const lights = document.querySelectorAll('.light-dot');

    btnStart.addEventListener('click', (e) => {
      createSparks(e.clientX, e.clientY);

      lights[0].classList.add('red');
      setTimeout(() => lights[1].classList.add('yellow'), 180);
      setTimeout(() => lights[2].classList.add('green'), 360);

      setTimeout(() => {
        screenIntro.classList.add('hide');
      }, 550);
    });

    document.querySelectorAll('.flower-item').forEach(flower => {
      flower.addEventListener('click', (e) => {
        const id = flower.getAttribute('data-id');
        const data = CARS_DATA[id];
        
        createSparks(e.clientX, e.clientY);

        modalCarImg.src = data.img;
        carName.textContent = data.name;
        modalNote.textContent = data.note;
        modal.classList.add('active');
      });
    });

    btnClose.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if(e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
